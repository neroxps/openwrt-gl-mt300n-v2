name: build-gl-mt300n-v2

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release to build against'
        required: false
        default: '25.12.5'

permissions:
  contents: write

env:
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '25.12.5' }}
  TARGET: ramips
  SUBTARGET: mt76x8
  PROFILE: glinet_gl-mt300n-v2
  TAILSCALE_VERSION: v1.98.3
  FRP_VERSION: v0.66.0
  # tailcat: netcat over Tailscale's data plane, no control plane / no account.
  # https://github.com/tailscale/tailcat
  TAILCAT_REF: main

jobs:
  # ------------------------------------------------------------------ lint --
  # Cheap static checks that each encode a bug which already shipped once.
  # They gate every other job, so a broken web UI cannot reach a release.
  lint:
    name: static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: LuCI view / menu.d / line-ending guards
        run: node tools/lint-views.js

      - name: Shell syntax of every on-device script
        run: |
          set -eux
          find files -type f \
            \( -path '*/usr/bin/*' -o -path '*/usr/sbin/*' \
               -o -path '*/etc/init.d/*' -o -path '*/etc/uci-defaults/*' \
               -o -path '*/etc/profile.d/*' \) -print0 |
            xargs -0 -r -n1 sh -n
          echo "shell syntax OK"

  # ---------------------------------------------------------------- payload --
  # Cross-compile the runtime payload for mipsel_24kc/softfloat.
  #
  # Two flavours, because the device only has 128 MB of RAM and the payload
  # lives in tmpfs (/tmp is a 60 MB tmpfs):
  #
  #   default             tailcat + frpc            (~47 MB)
  #   tailscale (optional) tailscaled + CLI          (~30 MB)
  #
  # tailcat is the default because it needs neither a Tailscale account nor a
  # kernel TUN device - it runs entirely in userspace (userspace WireGuard +
  # gVisor netstack). tailscaled is kept as a separate tarball so it can be
  # enabled on demand, but it is not part of the default install.
  payload:
    name: build runtime payload
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mipsel-linux-gnu

      - name: Fetch tailscale source
        uses: actions/checkout@v5
        with:
          repository: tailscale/tailscale
          ref: ${{ env.TAILSCALE_VERSION }}
          path: src/tailscale

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/tailscale/go.mod
          cache-dependency-path: src/tailscale/go.sum

      - name: Build tailscaled (CLI included)
        working-directory: src/tailscale
        env:
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
          CGO_ENABLED: '0'
        run: |
          set -eux
          TAGS="ts_include_cli,ts_omit_aws,ts_omit_bird,ts_omit_completion,ts_omit_kube,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm"
          LDFLAGS="-s -w -buildid= \
            -X tailscale.com/version.longStamp=${TAILSCALE_VERSION}-openwrt \
            -X tailscale.com/version.shortStamp=${TAILSCALE_VERSION}"
          mkdir -p "${GITHUB_WORKSPACE}/dist/bin"
          go build -trimpath -tags "$TAGS" -ldflags "$LDFLAGS" \
            -o "${GITHUB_WORKSPACE}/dist/bin/tailscaled" ./cmd/tailscaled
          mipsel-linux-gnu-strip --strip-unneeded "${GITHUB_WORKSPACE}/dist/bin/tailscaled" || true
          "${GITHUB_WORKSPACE}/dist/bin/tailscaled" --version 2>&1 | head -3 || true

      - name: Fetch frp source
        uses: actions/checkout@v5
        with:
          repository: fatedier/frp
          ref: ${{ env.FRP_VERSION }}
          path: src/frp

      - name: Build frpc
        working-directory: src/frp
        env:
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
          CGO_ENABLED: '0'
        run: |
          set -eux
          go build -trimpath -ldflags "-s -w -buildid=" -o "${GITHUB_WORKSPACE}/dist/bin/frpc" ./cmd/frpc
          mipsel-linux-gnu-strip --strip-unneeded "${GITHUB_WORKSPACE}/dist/bin/frpc" || true

      - name: Fetch tailcat source
        uses: actions/checkout@v5
        with:
          repository: tailscale/tailcat
          ref: ${{ env.TAILCAT_REF }}
          path: src/tailcat

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/tailcat/go.mod
          cache-dependency-path: src/tailcat/go.sum

      - name: Build tailcat
        working-directory: src/tailcat
        env:
          GOOS: linux
          GOARCH: mipsle
          GOMIPS: softfloat
          CGO_ENABLED: '0'
        run: |
          set -eux
          # tailcat ships its own recommended tag list; it omits every
          # tailscale.com feature the tool does not use (~16% smaller).
          TAGS="$(cat build-tags.txt)"
          echo "tags: $TAGS"
          mkdir -p "${GITHUB_WORKSPACE}/dist/bin"
          go build -trimpath -tags "$TAGS" -ldflags "-s -w -buildid=" \
            -o "${GITHUB_WORKSPACE}/dist/bin/tailcat" ./cmd/tailcat
          mipsel-linux-gnu-strip --strip-unneeded "${GITHUB_WORKSPACE}/dist/bin/tailcat" || true
          ls -l "${GITHUB_WORKSPACE}/dist/bin/tailcat"
          git rev-parse HEAD > "${GITHUB_WORKSPACE}/dist/TAILCAT_COMMIT"
          cat "${GITHUB_WORKSPACE}/dist/TAILCAT_COMMIT"

      - name: Package payload
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"

          # Sanity-check the cross builds. NOTE: these are MIPS binaries and
          # cannot be executed on the x86 runner.
          file dist/bin/tailcat dist/bin/frpc dist/bin/tailscaled
          for f in tailcat frpc tailscaled; do
            file "dist/bin/$f" | grep -q 'MIPS' || { echo "ERROR: $f is not a MIPS binary"; exit 1; }
          done

          rm -rf pkg-default pkg-tailscale
          mkdir -p pkg-default/bin pkg-tailscale/bin

          # default flavour: tailcat + frpc
          cp dist/bin/tailcat dist/bin/frpc pkg-default/bin/

          # optional flavour: the classic tailscale daemon; `tailscale` is the
          # same binary as `tailscaled` (argv[0] dispatch), exactly as the
          # OpenWrt package does it.
          cp dist/bin/tailscaled pkg-tailscale/bin/
          ln -sf tailscaled pkg-tailscale/bin/tailscale

          {
            echo "tailcat commit : $(cat dist/TAILCAT_COMMIT 2>/dev/null || echo unknown)"
            echo
            echo "flavour default  (payload-mipsel_24kc.tar.gz): tailcat + frpc"
            ls -l pkg-default/bin
            echo
            echo "flavour optional (payload-tailscale-mipsel_24kc.tar.gz): tailscaled + tailscale CLI"
            ls -l pkg-tailscale/bin
          } | tee dist/MANIFEST.txt

          tar -czf payload-mipsel_24kc.tar.gz           -C pkg-default   bin
          tar -czf payload-tailscale-mipsel_24kc.tar.gz -C pkg-tailscale bin
          ls -l payload-*.tar.gz
          sha256sum payload-mipsel_24kc.tar.gz           | tee payload.sha256
          sha256sum payload-tailscale-mipsel_24kc.tar.gz > payload.tailscale.sha256
          cat payload.tailscale.sha256

      - name: Payload size budget
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE"
          echo "=== default tarball ==="
          tar -tzvf payload-mipsel_24kc.tar.gz
          echo "=== optional tarball ==="
          tar -tzvf payload-tailscale-mipsel_24kc.tar.gz
          echo
          echo "tmpfs on the device is 60 MB; the default flavour must fit with room"
          echo "for the Go runtimes. Measured installed sizes:"
          du -sb pkg-default/bin pkg-tailscale/bin

      - name: Publish payload to the raw branch
        run: |
          set -eux
          # The device pulls the payload through a GitHub proxy. Proxy URLs for
          # /releases/latest/download/ answer 302 and the OpenWrt downloaders do
          # not follow redirects, so publish the same tarball as a plain repo
          # file on a dedicated `payload` branch - raw.githubusercontent.com
          # always answers 200 through the proxy.
          cd "$GITHUB_WORKSPACE"
          rm -rf pub
          mkdir pub
          cp payload-mipsel_24kc.tar.gz payload.sha256 pub/
          cp payload-tailscale-mipsel_24kc.tar.gz payload.tailscale.sha256 pub/
          cp "$GITHUB_WORKSPACE/dist/MANIFEST.txt" pub/ 2>/dev/null || true
          # The DERP map, mirrored. tailcat's own default
          # (https://tailcat.dev/derpmap.json) is not reachable from every
          # network, so the device points --derpmap-url at this copy instead.
          cp "$GITHUB_WORKSPACE/payload/derpmap.json" pub/derpmap.json
          cd pub
          git init -q -b payload
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add -A
          git commit -q -m "payload build ${GITHUB_RUN_ID}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            payload
          echo "published payload branch"

      - uses: actions/upload-artifact@v5
        with:
          name: payload
          path: |
            payload-mipsel_24kc.tar.gz
            payload.sha256
            payload-tailscale-mipsel_24kc.tar.gz
            payload.tailscale.sha256

  # ------------------------------------------------------------------ image --
  # Build the flashable sysupgrade image with the official ImageBuilder.
  image:
    name: build openwrt image
    needs: [ lint ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download ImageBuilder
        run: |
          set -eux
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
          IB="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.zst"
          curl -fsSL -o "$IB" "$BASE/$IB"
          curl -fsSL -o sha256sums "$BASE/sha256sums"
          # OpenWrt's sha256sums uses the binary-mode marker: "<hash> *<file>"
          grep -F "*${IB}" sha256sums | sha256sum -c -
          tar --zstd -xf "$IB"
          # The top-level directory carries a .Linux-x86_64 suffix; derive it
          # from the archive instead of guessing.
          IBDIR="$PWD/$(tar --zstd -tf "$IB" | head -1 | cut -d/ -f1)"
          [ -d "$IBDIR" ] || { echo "ERROR: ImageBuilder dir not found at $IBDIR"; ls -1; exit 1; }
          echo "IBDIR=$IBDIR" >> "$GITHUB_ENV"
          echo "ImageBuilder ready: $IBDIR"

      - name: Build image
        run: |
          set -eux
          cd "$IBDIR"
          # Extra packages on top of the target defaults:
          #   kmod-wireguard / wireguard-tools / luci-proto-wireguard -> WireGuard
          #   kmod-tun                                               -> tailscaled userspace
          #   ca-bundle                                              -> HTTPS for GitHub
          #   luci                                                   -> web UI
          # NOTE: zram-swap is deliberately NOT installed. The ramips/mt76x8
          # kernel is built without CONFIG_SWAP (/proc/swaps does not exist), so
          # zram cannot provide swap on this device - it would be dead weight.
          PKGS="kmod-wireguard wireguard-tools luci-proto-wireguard kmod-tun ca-bundle luci"
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/files/." files/
          # Single source of truth for the DERP map: payload/derpmap.json is
          # also published to the payload branch, and uhttpd serves this copy
          # locally so tailcat can bootstrap without any internet DNS.
          cp "$GITHUB_WORKSPACE/payload/derpmap.json" files/www/derpmap.json
          # The executable bit is not reliably preserved through git on Windows
          # checkouts, so set it explicitly for everything that must run.
          find files -type f \
            \( -path '*/usr/bin/*' -o -path '*/usr/sbin/*' \
               -o -path '*/etc/init.d/*' -o -path '*/etc/uci-defaults/*' \
               -o -path '*/etc/profile.d/*' \) \
            -exec chmod 0755 {} +
          echo "--- staged files (mode) ---"
          find files -type f -exec ls -l {} \;
          # Record the exact bytes of the custom web UI that go into this image,
          # so a build log is enough to tell which revision was flashed.
          echo "--- custom LuCI view scripts baked into this image ---"
          ( cd files && sha256sum www/luci-static/resources/view/mt300n/*.js )
          # Optional: bake an SSH public key so the flashed router is reachable
          # even right after a `sysupgrade -n` (config reset).
          if [ -n "${{ secrets.SSH_AUTHORIZED_KEY }}" ]; then
            mkdir -p files/etc/dropbear
            printf '%s\n' "${{ secrets.SSH_AUTHORIZED_KEY }}" > files/etc/dropbear/authorized_keys
            chmod 600 files/etc/dropbear/authorized_keys
            echo "authorized_keys injected"
          else
            echo "no SSH_AUTHORIZED_KEY secret - relying on empty root password"
          fi
          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="$PKGS" \
            FILES="files" \
            -j"$(nproc)"
          ls -l bin/targets/${TARGET}/${SUBTARGET}/

      - name: Collect artefacts
        run: |
          set -eux
          mkdir -p out
          cd "$IBDIR/bin/targets/${TARGET}/${SUBTARGET}"
          cp openwrt-*-${PROFILE}-squashfs-sysupgrade.bin "$GITHUB_WORKSPACE/out/"
          cp openwrt-*-${PROFILE}-initramfs-kernel.bin  "$GITHUB_WORKSPACE/out/" || true
          cp openwrt-*.manifest "$GITHUB_WORKSPACE/out/${PROFILE}.manifest" || true
          cd "$GITHUB_WORKSPACE/out"
          ls -l
          sha256sum *.bin > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: firmware
          path: out/*

  # ---------------------------------------------------------------- release --
  release:
    name: publish release
    needs: [ payload, image ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Flatten
        run: |
          set -eux
          mkdir -p rel
          find artifacts -type f -exec cp {} rel/ \;
          ls -l rel/

      - name: Tag
        id: tag
        run: |
          echo "tag=v${OPENWRT_VERSION}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "OpenWrt ${{ env.OPENWRT_VERSION }} for GL-MT300N-V2"
          body: |
            Auto-built OpenWrt ${{ env.OPENWRT_VERSION }} image for the
            GL.iNet GL-MT300N-V2 (ramips/mt76x8) plus the mipsel_24kc
            runtime payload (tailscale, frpc).

            * firmware: `*squashfs-sysupgrade.bin` — flash with `sysupgrade`
            * payload:  `payload-mipsel_24kc.tar.gz` — extracted to `/tmp` by
              `/usr/sbin/mt300n-install` on the device
          files: rel/*
          fail_on_unmatched_files: false
